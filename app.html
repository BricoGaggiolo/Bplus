<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>B+ Gestionale</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{--bg:#111;--panel:#1b1b1b;--panel2:#222;--border:#303030;--text:#f5f5f5;--muted:#9b9b9b;--red:#c62828;--red2:#7f1717;--green:#2e7d32;--blue:#1565c0;--radius:14px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{overflow-x:hidden}.app{min-height:100dvh}.top{height:60px;background:#151515;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}.brand{font-weight:800;font-size:18px}.top-actions{display:flex;gap:8px}.iconbtn{border:0;background:var(--panel2);color:#fff;width:42px;height:42px;border-radius:10px;font-size:18px;cursor:pointer}.layout{display:flex;min-height:calc(100dvh - 60px)}.side{width:240px;flex:none;background:#161616;border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:6px}.nav{width:100%;border:0;background:transparent;color:#bbb;text-align:left;padding:13px 14px;border-radius:10px;font-size:15px;cursor:pointer}.nav:hover,.nav.active{background:#2a0000;color:#fff}.side-spacer{flex:1}.logout{color:#ffb0b0}.main{flex:1;min-width:0}.content{max-width:1180px;margin:0 auto;padding:22px}.page{display:none}.page.active{display:block}.title{font-size:26px;font-weight:800;margin:0 0 6px}.subtitle{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px}.stat{font-size:28px;font-weight:800;margin-top:8px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 10px}.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:600px}.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}.table th{font-size:12px;color:var(--muted);text-transform:uppercase}.empty{padding:24px;text-align:center;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:0;background:var(--red);color:#fff;padding:11px 15px;border-radius:10px;font-weight:700;cursor:pointer}.btn.secondary{background:var(--panel2);border:1px solid var(--border)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#121212;border:1px solid var(--border);border-radius:10px;color:#fff;padding:12px;font:inherit}.field textarea{min-height:90px;resize:vertical}.notice{padding:13px 15px;border-radius:10px;background:#242424;border:1px solid var(--border);margin-bottom:8px}.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(84vw,310px);background:#161616;border-right:1px solid var(--border);z-index:51;transform:translateX(-105%);transition:transform .18s ease;padding:18px}.drawer.open{transform:translateX(0)}.drawer-backdrop.open{display:block}.bottom{display:none}
@media(max-width:760px){.side{display:none}.content{padding:16px 12px calc(90px + env(safe-area-inset-bottom))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.title{font-size:22px}.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(68px + env(safe-area-inset-bottom));padding:5px 5px env(safe-area-inset-bottom);display:flex;background:#171717;border-top:1px solid var(--border);z-index:40}.bottom button{flex:1;min-width:0;border:0;background:transparent;color:#aaa;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;cursor:pointer}.bottom button span{font-size:21px}.bottom button.active{background:#2a0000;color:#fff}.top{padding:0 10px}.top .brand{font-size:16px}.drawer-backdrop.open{display:block}}
@media(max-width:420px){.grid{grid-template-columns:1fr}.card{padding:15px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">B+ Gestionale</div><div class="top-actions"><button class="iconbtn" id="notifyBtn" aria-label="Notifiche">🔔</button><button class="iconbtn" id="mobileMenu" aria-label="Menu">☰</button></div></header>
<div class="layout">
<aside class="side" id="side"><button class="nav active" data-page="dashboard">🏠 Dashboard</button><button class="nav" data-page="turni">📅 Turni</button><button class="nav" data-page="assenze">🗓️ Assenze</button><button class="nav" data-page="storico">📋 Storico</button><div class="side-spacer"></div><button class="nav logout" id="logoutSide">↪ Esci</button></aside>
<main class="main"><div class="content">
<section class="page active" id="dashboard"><h1 class="title">Dashboard</h1><p class="subtitle" id="welcome"></p><div class="grid"><div class="card"><div class="label">Turni settimana</div><div class="stat" id="statShifts">0</div></div><div class="card"><div class="label">Ore settimana</div><div class="stat" id="statHours">0</div></div><div class="card"><div class="label">Assenze</div><div class="stat" id="statAbsences">0</div></div><div class="card"><div class="label">Notifiche</div><div class="stat" id="statNotifications">0</div></div></div><div class="section"><h2>Prossimi turni</h2><div class="card" id="nextShifts"></div></div></section>
<section class="page" id="turni"><h1 class="title">Turni</h1><p class="subtitle">Programmazione e consultazione dei turni.</p><div class="actions"><button class="btn" id="addShift">+ Nuovo turno</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Dipendente</th><th>Inizio</th><th>Fine</th><th>Stato</th></tr></thead><tbody id="shiftRows"></tbody></table></div></section>
<section class="page" id="assenze"><h1 class="title">Assenze</h1><p class="subtitle">Richieste e stato delle assenze.</p><div class="actions"><button class="btn" id="addAbsence">+ Nuova assenza</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Dal</th><th>Al</th><th>Tipo</th><th>Stato</th><th>Note</th></tr></thead><tbody id="absenceRows"></tbody></table></div></section>
<section class="page" id="storico"><h1 class="title">Storico</h1><p class="subtitle">Riepilogo delle attività registrate.</p><div class="section"><div class="card" id="history"></div></div></section>
</div></main></div>
<nav class="bottom" aria-label="Navigazione mobile"><button data-page="dashboard"><span>⌂</span>Home</button><button data-page="turni"><span>▣</span>Turni</button><button data-page="assenze"><span>◷</span>Assenze</button><button data-page="storico"><span>☷</span>Storico</button><button id="bottomMore"><span>☰</span>Altro</button></nav>
<div class="drawer-backdrop" id="backdrop"></div><aside class="drawer" id="drawer"><h2 style="margin-top:4px">Menu</h2><button class="nav" data-page="dashboard">🏠 Dashboard</button><button class="nav" data-page="turni">📅 Turni</button><button class="nav" data-page="assenze">🗓️ Assenze</button><button class="nav" data-page="storico">📋 Storico</button><button class="nav logout" id="logoutDrawer">↪ Esci</button></aside>
</div>
<script>
(function(){
'use strict';
const USER={id:2,email:'d.piaia@laquattrosrl.it',nome:'Davide',cognome:'Piaia',ruolo:3};
const KEY='bplus_data_v2';
let data=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{shifts:[],absences:[],notifications:[],history:[]}}catch(e){return{shifts:[],absences:[],notifications:[],history:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function go(page){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===page));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));closeDrawer();render();window.scrollTo(0,0)}
function bindNav(){document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();go(el.dataset.page)}));}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('backdrop').classList.remove('open')}
function logout(){sessionStorage.removeItem('bplus_uid');location.replace('./index.html')}
function render(){
const shifts=data.shifts.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));
const abs=data.absences.slice().sort((a,b)=>b.from.localeCompare(a.from));
document.getElementById('welcome').textContent='Benvenuto '+USER.nome+' '+USER.cognome;
document.getElementById('statShifts').textContent=shifts.length;
document.getElementById('statHours').textContent=shifts.reduce((s,x)=>s+hours(x.start,x.end),0).toFixed(1);
document.getElementById('statAbsences').textContent=abs.length;
document.getElementById('statNotifications').textContent=data.notifications.filter(x=>!x.read).length;
document.getElementById('nextShifts').innerHTML=shifts.slice(0,5).map(x=>'<div class="notice"><b>'+esc(x.date)+'</b> · '+esc(x.start)+'–'+esc(x.end)+'<br><span style="color:var(--muted)">'+esc(x.employee||USER.nome+' '+USER.cognome)+'</span></div>').join('')||'<div class="empty">Nessun turno registrato.</div>';
document.getElementById('shiftRows').innerHTML=shifts.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.employee||USER.nome+' '+USER.cognome)+'</td><td>'+esc(x.start)+'</td><td>'+esc(x.end)+'</td><td>'+esc(x.status||'Pianificato')+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">Nessun turno.</td></tr>';
document.getElementById('absenceRows').innerHTML=abs.map(x=>'<tr><td>'+esc(x.from)+'</td><td>'+esc(x.to)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.note||'')+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">Nessuna assenza.</td></tr>';
document.getElementById('history').innerHTML=data.history.slice(-30).reverse().map(x=>'<div class="notice"><b>'+esc(x.when)+'</b> · '+esc(x.text)+'</div>').join('')||'<div class="empty">Nessuna attività.</div>';
}
function hours(a,b){const p=a.split(':').map(Number),q=b.split(':').map(Number);let x=(q[0]*60+q[1])-(p[0]*60+p[1]);if(x<0)x+=1440;return x/60}
function addShift(){const date=prompt('Data (AAAA-MM-GG)',new Date().toISOString().slice(0,10));if(!date)return;const start=prompt('Ora inizio','08:00');if(!start)return;const end=prompt('Ora fine','17:00');if(!end)return;data.shifts.push({date,start,end,employee:USER.nome+' '+USER.cognome,status:'Pianificato'});data.history.push({when:new Date().toLocaleString('it-IT'),text:'Creato turno '+date+' '+start+'–'+end});save();render()}
function addAbsence(){const from=prompt('Dal (AAAA-MM-GG)',new Date().toISOString().slice(0,10));if(!from)return;const to=prompt('Al (AAAA-MM-GG)',from);if(!to)return;const type=prompt('Tipo: Ferie / Malattia / Permesso','Ferie')||'Ferie';const note=prompt('Note','')||'';data.absences.push({from,to,type,status:'In attesa',note});data.history.push({when:new Date().toLocaleString('it-IT'),text:'Richiesta assenza '+from+'–'+to});save();render()}
function notify(){data.notifications=data.notifications.map(x=>({...x,read:true}));save();render();alert('Nessuna nuova notifica.');}
document.getElementById('mobileMenu').addEventListener('click',()=>{document.getElementById('drawer').classList.add('open');document.getElementById('backdrop').classList.add('open')});document.getElementById('bottomMore').addEventListener('click',()=>{document.getElementById('drawer').classList.add('open');document.getElementById('backdrop').classList.add('open')});document.getElementById('backdrop').addEventListener('click',closeDrawer);document.getElementById('logoutSide').addEventListener('click',logout);document.getElementById('logoutDrawer').addEventListener('click',logout);document.getElementById('addShift').addEventListener('click',addShift);document.getElementById('addAbsence').addEventListener('click',addAbsence);document.getElementById('notifyBtn').addEventListener('click',notify);bindNav();render();
})();
</script>
</body>
</html>
