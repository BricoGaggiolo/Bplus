<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B+ Gestionale – Accesso</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#c62828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}body{display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh}.card{width:100%;max-width:360px}.logo{text-align:center;margin-bottom:28px}.logo img{width:72px;height:72px;border-radius:16px}.logo h1{color:#fff;font-size:20px;font-weight:800;margin-top:12px}.logo p{color:#666;font-size:13px;margin-top:4px}.form{background:#1e1e1e;border-radius:16px;padding:24px;border:1px solid #2a2a2a}label{display:block;font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}input{width:100%;padding:13px 14px;background:#2a2a2a;border:1.5px solid #333;border-radius:10px;color:#fff;font-size:16px;outline:none;margin-bottom:16px;-webkit-appearance:none}input:focus{border-color:#c62828}.btn{width:100%;padding:14px;background:#c62828;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;-webkit-appearance:none;touch-action:manipulation}.btn:active{opacity:.85}.err{color:#ef9a9a;font-size:13px;text-align:center;margin-top:12px;display:none;background:#2a0000;padding:10px;border-radius:8px}.footer{text-align:center;color:#444;font-size:11px;margin-top:20px}
</style>
</head>
<body><div class="card"><div class="logo"><img src="./icons/icon-192.png" alt="B+"><h1>B+ Gestionale HR</h1><p>La Quattro S.r.l.</p></div><div class="form"><label for="em">Email</label><input id="em" type="text" inputmode="email" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="d.piaia@laquattrosrl.it"><label for="pw">Password</label><input id="pw" type="password" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="••••••••"><button class="btn" onclick="login()">Accedi</button><div class="err" id="err"></div></div><div class="footer">B+ Gestionale &middot; La Quattro S.r.l.</div></div>
<script>
var UTENTE={id:2,email:'d.piaia@laquattrosrl.it',password:'LaQuattro2',nome:'Davide',cognome:'Piaia',ruolo:3};
var swReady=Promise.resolve();
if('serviceWorker' in navigator){swReady=navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(function(reg){return navigator.serviceWorker.ready;}).catch(function(){return null;});}
var sess=sessionStorage.getItem('bplus_uid');if(sess){swReady.then(function(){window.location.replace('./app.html');});}
function login(){var em=document.getElementById('em').value.trim().toLowerCase(),pw=document.getElementById('pw').value.trim(),err=document.getElementById('err');err.style.display='none';if(!em||!pw){err.textContent='Inserisci email e password';err.style.display='block';return}if(em!==UTENTE.email){err.textContent='Email non autorizzata';err.style.display='block';return}if(pw!==UTENTE.password){err.textContent='Password non corretta';err.style.display='block';return}sessionStorage.setItem('bplus_uid',String(UTENTE.id));sessionStorage.setItem('bplus_ts',Date.now());swReady.then(function(){window.location.replace('./app.html');});}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')login()});document.getElementById('em').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pw').focus()});
</script></body></html>
