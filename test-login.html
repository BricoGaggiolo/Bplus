<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Login B+</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;padding:20px;max-width:400px;margin:auto}
input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:8px;
  border:1px solid #444;background:#222;color:#fff;font-size:16px}
button{width:100%;padding:12px;background:#c62828;color:#fff;border:none;
  border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
pre{background:#1e1e1e;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<h2 style="color:#c62828">Test Login B+</h2>

<input id="em" type="text" placeholder="email" autocomplete="off" autocapitalize="off">
<input id="pw" type="text" placeholder="password" autocomplete="off" autocapitalize="off">
<button onclick="test()">Test Login</button>
<button onclick="testDiretto()" style="background:#333;margin-top:4px">Login diretto (senza verifica PW)</button>
<pre id="out">Inserisci le credenziali e premi Test Login</pre>

<script>
const DIPENDENTI = [
  {id:1, nome:'Stefano', cognome:'Santelena', email:'s.santelena@laquattrosrl.it', password:'LaQuattro1', ruolo:3},
  {id:2, nome:'Davide',  cognome:'Piaia',     email:'d.piaia@laquattrosrl.it',     password:'LaQuattro2', ruolo:3},
];

function log(msg){ document.getElementById('out').textContent += '\n' + msg; }

function test(){
  document.getElementById('out').textContent = '';
  const email = document.getElementById('em').value;
  const pw    = document.getElementById('pw').value;
  const emailN = email.trim().toLowerCase().replace(/\s/g,'');
  const pwN    = pw.trim();
  
  log('Email raw: [' + email + '] len=' + email.length);
  log('Email norm: [' + emailN + ']');
  log('PW raw: [' + pw + '] len=' + pw.length);
  log('PW norm: [' + pwN + ']');
  log('---');
  
  DIPENDENTI.forEach(d => {
    const emailD = d.email.trim().toLowerCase();
    const match = emailD === emailN;
    log('Confronto con ' + d.nome + ':');
    log('  email DB: [' + emailD + '] match=' + match);
    if(match){
      const pwMatch = d.password === pwN;
      log('  PW DB: [' + d.password + ']');
      log('  PW match: ' + pwMatch);
      if(pwMatch){
        log('✅ LOGIN OK!');
        setTimeout(()=>{
          window.location.href = '/Bplus/index.html';
        }, 1500);
      } else {
        log('❌ PW errata');
      }
    }
  });
}

function testDiretto(){
  log('\n=== Login diretto senza verifica ===');
  window.location.href = '/Bplus/index.html';
}
</script>
</body></html>
